name: Update profile graphics

on:
  schedule:
    - cron: "17 */6 * * *" # every 6 hours
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", ".github/workflows/profile.yml"]

permissions:
  contents: write

concurrency:
  group: profile
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build the contribution card
        run: node scripts/stats.mjs "${{ github.repository_owner }}"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          STATS_TZ: Asia/Dhaka

      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#0A66C2&color_dots=#ebedf0,#b6e3ff,#54aeff,#0969da,#0a3069
            dist/github-snake-dark.svg?color_snake=#FFB454&color_dots=#161b22,#0c2d48,#145da0,#2e8bc0,#36bcf7

      - name: Push to output branch
        run: |
          cd dist
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Update profile graphics"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:output
